<svg xmlns="http://www.w3.org/2000/svg" viewBox="28 28 200 200" fill="none" role="img" aria-label="Hourglass">
  <!--
    The die, reduced. A cube seen down its (1,1,1) diagonal projects to a regular
    hexagon; splitting it the way the cube splits gives six triangles around the
    centre, and every opposite pair is a bowtie. Three bowties, three axes, with
    the necks meeting where the cube's centre is.

    The viewBox is cropped to the mark, so it fills its box at any size
    rather than sitting in built-in padding.

    Colours are literal, not currentColor: an SVG loaded through <img> has no
    parent to inherit from and would fall back to black.
  -->
  <path d="M128 128L128.0 28.0L214.6 78.0ZM128 128L128.0 228.0L41.4 178.0Z" fill="#7ff2cd"/>
  <path d="M128 128L214.6 78.0L214.6 178.0ZM128 128L41.4 178.0L41.4 78.0Z" fill="#35c396"/>
  <path d="M128 128L214.6 178.0L128.0 228.0ZM128 128L41.4 78.0L128.0 28.0Z" fill="#126b51"/>
</svg>
